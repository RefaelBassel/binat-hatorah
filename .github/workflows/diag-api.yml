name: diag-api
on: workflow_dispatch
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Compare and test the repository key (prints a hash, never the key)
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "secret: len ${#K} sha $(printf %s "$K" | sha256sum | cut -c1-12)"
          for mt in 8 32000 64000; do
            printf "max_tokens=%s " "$mt"
            curl -s https://api.anthropic.com/v1/messages -H "x-api-key: $K" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
              -d "{\"model\":\"claude-opus-5-5\",\"max_tokens\":$mt,\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}]}" | jq -c '{type, err: .error.message, text: (.content[0].text // null)}'
          done
